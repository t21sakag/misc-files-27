name: AnkiPad
options:
  bundleIdPrefix: com.localtools
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    HEADER_SEARCH_PATHS: ['$(inherited)', '$(SDKROOT)/usr/include/libxml2']
    TARGETED_DEVICE_FAMILY: '2'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_OBJC_BRIDGING_HEADER: AnkiPad/Bridge.h
    LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(PROJECT_DIR)/../build/native/$(PLATFORM_NAME)']
    OTHER_LDFLAGS: ['$(inherited)', '-lankipad_bridge', '-lc++', '-lz', '-liconv', '-lresolv', '-lxml2', '-framework', 'Security', '-framework', 'SystemConfiguration']
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: AnkiPad
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
    MARKETING_VERSION: '0.2.0'
    ANKIPAD_SOURCE_COMMIT: development
    CURRENT_PROJECT_VERSION: '2'
    STUDY_SHARED_GROUP: group.com.localtools.studyclient.shared
targets:
  AnkiPad:
    type: application
    platform: iOS
    info:
      path: ../build/AnkiPad-Info.plist
      properties:
        AnkiPadSourceCommit: $(ANKIPAD_SOURCE_COMMIT)
        StudySharedGroup: $(STUDY_SHARED_GROUP)
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Study Documents
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - local.studyclient.deck-package
              - local.studyclient.collection-package
              - public.comma-separated-values-text
              - public.tab-separated-values-text
              - public.plain-text
              - public.image
              - public.audio
              - public.movie
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: local.studyclient.deck-package
            UTTypeDescription: Anki Deck Package
            UTTypeConformsTo: [public.data, public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [apkg]
              public.mime-type: [application/apkg, application/x-apkg, application/vnd.anki]
          - UTTypeIdentifier: local.studyclient.collection-package
            UTTypeDescription: Anki Collection Package
            UTTypeConformsTo: [public.data, public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [colpkg]
              public.mime-type: [application/colpkg, application/x-colpkg]
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: local.studyclient.browser
            CFBundleURLSchemes: [studyclient, anki]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: カードのフィールドに挿入する写真を撮影します。
        NSSpeechRecognitionUsageDescription: カードの音声入力を文字に変換します。
        NSMicrophoneUsageDescription: 学習中の発音練習、カードへの音声入力、フィールドに挿入する音声の録音にマイクを使います。
        NSLocalNetworkUsageDescription: 独自の同期サーバーやアプリ内の画面に接続します。
    dependencies:
      - target: ShareExtension
        embed: true
    sources:
      - path: SharedClient
      - path: AnkiPad
        excludes: [Resources]
      - path: AnkiPad/Resources
        excludes: [backend]
        buildPhase: resources
      - path: AnkiPad/Resources/backend
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localtools.studyclient
        TARGETED_DEVICE_FAMILY: '2'
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': Simulator.entitlements
    scheme:
      testTargets: [AnkiPadUITests]
  AnkiPadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [{path: AnkiPadUITests, excludes: [ReceivedFixtures]}, {path: AnkiPadUITests/ReceivedFixtures, type: folder, buildPhase: resources}, AnkiPad/MediaImagePreparation.swift, AnkiPad/NoteImageRendering.swift, AnkiPad/CardAudio.swift, AnkiPad/StudyMotion.swift, AnkiPad/StudyMotionPolicy.swift, AnkiPad/StudyTheme.swift, AnkiPad/AppText.swift, AnkiPad/UITestIsolation.swift, AnkiPad/BoundedImageFile.swift, AnkiPad/DeckBackgroundStore.swift]
    dependencies:
      - target: AnkiPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localtools.studyclient.uitests
        SWIFT_OBJC_BRIDGING_HEADER: ''
        OTHER_LDFLAGS: ['$(inherited)']
  ShareExtension:
    type: app-extension
    platform: iOS
    info:
      path: ../build/ShareExtension-Info.plist
      properties:
        CFBundleDisplayName: AnkiPad
        AnkiPadSourceCommit: $(ANKIPAD_SOURCE_COMMIT)
        StudySharedGroup: $(STUDY_SHARED_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
    sources:
      - path: ShareExtension
      - path: SharedClient
      - path: AnkiPad/AppText.swift
      - path: AnkiPad/Resources/ja.lproj/Localizable.strings
        buildPhase: resources
      - path: AnkiPad/Resources/en.lproj/Localizable.strings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localtools.studyclient.share
        TARGETED_DEVICE_FAMILY: '2'
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: ''
        OTHER_LDFLAGS: []
        HEADER_SEARCH_PATHS: []
        LIBRARY_SEARCH_PATHS: []
        CODE_SIGN_ENTITLEMENTS: Share.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': ShareSimulator.entitlements
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
