name: Misc checks
run-name: "Check ${{ inputs.mode || 'full' }}"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'compile: コンパイルだけ / ui: 操作検証 / ipa: 配布用IPAだけ / full: 全検証'
        type: choice
        default: compile
        options: [compile, ui, ipa, full]
      ui_suite:
        description: 'uiモードで実行する操作テスト'
        type: choice
        default: changed
        options: [share-text, milestone, changed, profiles, shared, reviewer, sync, automatic, backups, repair, collapse, reminders, p1, images, controls, p1-next, voice, speech, occlusion, preview, whiteboard, network, timebox, appearance, answer-layout, layout-regression, card-appearance, templates, conditional-reminders, conditional-only, reminder-refresh, review-header, typing-focus, card-links, template-audio, script-dialogs, browser-appearance, themes, milestone-repair, button-timing, motion, motion-only, background, background-ui, background-storage, background-selection, theme-panels, theme-repair, batch-check, web-themes, web-theme-only, engine-languages, languages, language-only, incoming-core, incoming-browser, incoming-deferred, incoming-text, incoming-text-cancel, incoming-text-save, incoming-files, incoming-file-cancel, incoming-image, incoming-raster, notification-baseline, recovery-baseline, incoming-milestone, incoming-repair, incoming-final, incoming-collection-cancel, incoming-audio-video, incoming-occlusion, incoming-final-repair, reminder-repair, regression-repair, upload-only, incoming-fields, incoming-commit, incoming-apkg, incoming-colpkg, incoming-tsv, incoming-invalid, incoming-still-note, incoming-commit-repair, all]
permissions:
  contents: read
concurrency:
  group: ipad-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    outputs:
      batches: ${{ steps.ui-batch-plan.outputs.matrix }}
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      CI_MODE: ${{ inputs.mode || 'full' }}
      UI_SUITE: ${{ inputs.ui_suite || 'all' }}
    timeout-minutes: ${{ (inputs.mode == 'compile' && 30) || (inputs.mode == 'ipa' && 30) || (inputs.mode == 'ui' && (inputs.ui_suite == 'automatic' || inputs.ui_suite == 'reminder-repair') && 60) || (inputs.mode == 'ui' && inputs.ui_suite != 'all' && 40) || 150 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Validate selected CI scope
        run: |
          case "$CI_MODE" in compile|ui|ipa|full) ;; *) exit 2 ;; esac
          mkdir -p build
          python3 scripts/select-ui-tests.py "$UI_SUITE" "$CI_MODE" > build/ui-test-arguments.txt
      - name: Test actual loopback routing for bundled interfaces
        run: |
          mkdir -p build
          swiftc ios/AnkiPad/AppText.swift -swift-version 5 -target arm64-apple-macosx15.0 -parse-as-library ios/AnkiPad/StaticAssetServer.swift tests/asset_server_smoke.swift -o build/asset-server-smoke
          build/asset-server-smoke
      - name: Test native translations and language policy
        run: |
          python3 tests/localization_resources_smoke.py
          swiftc -target arm64-apple-macosx15.0 -swift-version 5 -parse-as-library ios/AnkiPad/AppText.swift tests/app_text_smoke.swift -o build/app-text-smoke
          build/app-text-smoke ios/AnkiPad/Resources
      - name: Test incoming request contracts and owned file lifetime
        if: env.CI_MODE == 'compile' || env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && startsWith(env.UI_SUITE, 'incoming'))
        run: |
          swiftc -target arm64-apple-macosx15.0 -swift-version 5 -parse-as-library ios/AnkiPad/BrowserLink.swift tests/browser_link_smoke.swift -o build/browser-link-smoke
          build/browser-link-smoke tests/browser_links.json
          swiftc -target arm64-apple-macosx15.0 -swift-version 5 -parse-as-library ios/AnkiPad/IncomingNoteDraft.swift tests/incoming_note_draft_smoke.swift -o build/incoming-note-draft-smoke
          build/incoming-note-draft-smoke
          swiftc -target arm64-apple-macosx15.0 -swift-version 5 -parse-as-library ios/AnkiPad/NewNoteFields.swift tests/new_note_fields_smoke.swift -o build/new-note-fields-smoke
          build/new-note-fields-smoke
          swiftc -target arm64-apple-macosx15.0 -swift-version 5 -parse-as-library ios/AnkiPad/AppText.swift ios/AnkiPad/IncomingImportFile.swift tests/incoming_import_file_smoke.swift -o build/incoming-import-file-smoke
          build/incoming-import-file-smoke
      - name: Test shared inbox and resigned group selection
        if: env.CI_MODE == 'compile' || env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && startsWith(env.UI_SUITE, 'share'))
        run: |
          swiftc -target arm64-apple-macosx15.0 -swift-version 5 -parse-as-library ios/SharedClient/SharedGroup.swift ios/SharedClient/SharedInbox.swift ios/SharedClient/SharedClientSettings.swift tests/shared_inbox_smoke.swift -o build/shared-inbox-smoke
          cp build/shared-inbox-smoke build/shared-group-probe
          codesign --force --sign - --timestamp=none --entitlements tests/shared_group_probe.entitlements build/shared-group-probe
          build/shared-inbox-smoke build/shared-group-probe
      - name: Test full sync direction safety
        run: |
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -swift-version 5 -parse-as-library ios/AnkiPad/SyncDecision.swift tests/sync_decision_smoke.swift -o build/sync-decision-smoke
          build/sync-decision-smoke
      - name: Test study timebox interval and answer counts
        run: |
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -swift-version 5 -parse-as-library ios/AnkiPad/ReviewTimebox.swift tests/review_timebox_smoke.swift -o build/review-timebox-smoke
          build/review-timebox-smoke
      - name: Test network sync preference policy and persistence
        run: |
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -swift-version 5 -parse-as-library ios/AnkiPad/SyncNetworkPreferences.swift tests/sync_network_preferences_smoke.swift -o build/sync-network-preferences-smoke
          build/sync-network-preferences-smoke
      - name: Test automatic sync scheduling and offline state
        run: |
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -swift-version 5 -parse-as-library ios/AnkiPad/AutomaticSyncPolicy.swift tests/automatic_sync_policy_smoke.swift -o build/automatic-sync-policy-smoke
          build/automatic-sync-policy-smoke
      - name: Test stored backup share snapshot preservation
        run: |
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -swift-version 5 -parse-as-library ios/AnkiPad/BackupExport.swift tests/backup_export_smoke.swift -o build/backup-export-smoke
          build/backup-export-smoke
      - name: Test inert speech parsing and scoped selection persistence
        run: |
          sdk_root=$(xcrun --sdk macosx --show-sdk-path)
          xcrun clang -Wall -Wextra -I"$sdk_root/usr/include/libxml2" -c ios/AnkiPad/SpeechHTML.c -o build/SpeechHTML.o
          xcrun clang -dynamiclib -I"$sdk_root/usr/include/libxml2" ios/AnkiPad/SpeechHTML.c -lxml2 -o build/libspeechhtml.dylib
          python3 tests/speech_html_smoke.py build/libspeechhtml.dylib
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -swift-version 5 -parse-as-library -import-objc-header ios/AnkiPad/SpeechHTML.h ios/AnkiPad/LegacySpeechText.swift ios/AnkiPad/ReviewSpeechPreferences.swift ios/AnkiPad/ReviewSpeechPlan.swift tests/review_speech_smoke.swift build/SpeechHTML.o -lxml2 -o build/review-speech-smoke
          build/review-speech-smoke
      - name: Test reminder configuration validity and persistence
        run: |
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -swift-version 5 -parse-as-library ios/AnkiPad/ReviewReminderConfiguration.swift tests/reminder_configuration_smoke.swift -o build/reminder-configuration-smoke
          build/reminder-configuration-smoke
      - name: Test nested list visibility and aggregate counts
        run: |
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -swift-version 5 -parse-as-library ios/AnkiPad/DeckTree.swift tests/deck_tree_smoke.swift -o build/deck-tree-smoke
          build/deck-tree-smoke
      - name: Test per-list drawing preferences
        run: |
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -swift-version 5 -parse-as-library ios/AnkiPad/WhiteboardPreferences.swift tests/whiteboard_preferences_smoke.swift -o build/whiteboard-preferences-smoke
          build/whiteboard-preferences-smoke
      - name: Test fixture scope against actual XCTest ports
        run: python3 tests/sync_fixture_scope_smoke.py
      - name: Test owned simulator lifecycle
        run: python3 tests/ci_simulator_smoke.py
      - name: Test cache input selection
        run: python3 tests/cache_input_hashes_smoke.py
      - name: Test compiler input timestamp restoration
        run: python3 tests/xcode_input_mtimes_smoke.py
      - name: Test isolated test-case storage and relaunch persistence
        run: |
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -DDEBUG -swift-version 5 -parse-as-library ios/AnkiPad/UITestIsolation.swift tests/ui_test_isolation_smoke.swift -o build/ui-test-isolation-smoke
          build/ui-test-isolation-smoke
      - name: Validate UI case grouping and scope selection
        run: python3 tests/ui_case_groups_smoke.py
      - name: Test serial case partition and compiled product transfer
        run: python3 tests/ui_batch_transfer_smoke.py
      - name: Test interrupted sync marker persistence
        run: |
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -swift-version 5 -parse-as-library ios/AnkiPad/SyncActivityStore.swift tests/sync_activity_smoke.swift -o build/sync-activity-smoke
          build/sync-activity-smoke
      - name: Test card touch bridge cancellation and control exclusions
        run: node tests/review_touch_bridge_smoke.js
      - name: Test persistent reviewer gesture configuration
        run: |
          swiftc ios/AnkiPad/AppText.swift -swift-version 5 -target arm64-apple-macosx15.0 -parse-as-library ios/AnkiPad/ReviewGestureConfiguration.swift ios/AnkiPad/ReviewKeyboardConfiguration.swift ios/AnkiPad/ReviewGamepadConfiguration.swift ios/AnkiPad/ReviewTouchConfiguration.swift ios/AnkiPad/ReviewToolbarConfiguration.swift tests/gesture_configuration_smoke.swift -o build/gesture-configuration-smoke
          build/gesture-configuration-smoke
      - name: Test profile registry preservation and deletion rollback
        run: |
          swiftc ios/AnkiPad/AppText.swift -swift-version 5 -target arm64-apple-macosx15.0 -parse-as-library ios/AnkiPad/ProfileRegistry.swift tests/profile_registry_smoke.swift -o build/profile-registry-smoke
          build/profile-registry-smoke
      - name: Test local image source parsing and exact HTML replacement
        run: |
          swiftc ios/AnkiPad/AppText.swift -swift-version 5 -target arm64-apple-macosx15.0 -parse-as-library ios/AnkiPad/FieldImageReferences.swift tests/field_image_references_smoke.swift -o build/field-image-references-smoke
          build/field-image-references-smoke
      - name: Record actual Apple toolchain and runtimes
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
      - name: Start requested iPadOS 27 simulator before native setup
        id: ui-simulator
        if: env.CI_MODE == 'ui' && env.UI_SUITE != 'batch-check' && env.UI_SUITE != 'all'
        run: |
          simulator_id=$(python3 scripts/ci-simulator.py create)
          echo "simulator=$simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$simulator_id" -b > build/simulator-boot.log 2>&1 &
      - name: Identify exact native engine/toolchain
        id: native-version
        run: |
          python3 scripts/cache-input-hashes.py >> "$GITHUB_OUTPUT"
          echo "anki=$(git rev-parse HEAD:vendor/anki)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -c 1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: native-host
        if: env.CI_MODE == 'full' || env.CI_MODE == 'ui'
        with:
          path: build/native/host
          key: bridge-host-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-version.outputs.anki }}-${{ steps.native-version.outputs.xcode }}-${{ steps.native-version.outputs.bridge }}
      - uses: actions/cache/restore@v4
        id: native-device
        if: env.CI_MODE == 'full' || env.CI_MODE == 'ipa'
        with:
          path: build/native/iphoneos
          key: bridge-device-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-version.outputs.anki }}-${{ steps.native-version.outputs.xcode }}-${{ steps.native-version.outputs.bridge }}
      - uses: actions/cache/restore@v4
        id: native-simulator
        if: env.CI_MODE != 'ipa'
        with:
          path: build/native/iphonesimulator
          key: bridge-simulator-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-version.outputs.anki }}-${{ steps.native-version.outputs.xcode }}-${{ steps.native-version.outputs.bridge }}
      - name: Determine missing native outputs
        id: native-plan
        env:
          NEED_HOST: ${{ (env.CI_MODE == 'full' || env.CI_MODE == 'ui') && steps.native-host.outputs.cache-hit != 'true' }}
          NEED_DEVICE: ${{ (env.CI_MODE == 'full' || env.CI_MODE == 'ipa') && steps.native-device.outputs.cache-hit != 'true' }}
          NEED_SIMULATOR: ${{ env.CI_MODE != 'ipa' && steps.native-simulator.outputs.cache-hit != 'true' }}
        run: |
          if [ "$NEED_HOST" = true ] || [ "$NEED_DEVICE" = true ] || [ "$NEED_SIMULATOR" = true ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install app build tool
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Get pinned dependencies
        if: steps.native-plan.outputs.build == 'true'
        run: |
          git submodule update --init --depth 1 vendor/anki
          git -C vendor/anki submodule update --init --depth 1 ftl/core-repo ftl/qt-repo
      - name: Install native build tools only on cache miss
        if: steps.native-plan.outputs.build == 'true'
        run: |
          if ! command -v protoc >/dev/null; then brew install protobuf; fi
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
      - uses: actions/cache@v4
        if: steps.native-plan.outputs.build == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-xcode27-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-version.outputs.cargo }}
          restore-keys: |
            native-xcode27-${{ runner.os }}-${{ runner.arch }}-
            native-${{ runner.os }}-${{ runner.arch }}-
      - name: Build native host engine
        if: (env.CI_MODE == 'full' || env.CI_MODE == 'ui') && steps.native-host.outputs.cache-hit != 'true'
        run: bash scripts/build-native.sh host
      - name: Save completed native host outputs before app/UI checks
        uses: actions/cache/save@v4
        if: (env.CI_MODE == 'full' || env.CI_MODE == 'ui') && steps.native-host.outputs.cache-hit != 'true'
        with:
          path: build/native/host
          key: ${{ steps.native-host.outputs.cache-primary-key }}
      - name: Test real package import, rendering, scheduling, undo and persistence
        if: env.CI_MODE == 'full' || env.CI_MODE == 'ui'
        run: python3 tests/engine_smoke.py build/native/host/libankipad_bridge.dylib build/fixture.apkg
      - name: Prepare real incoming document fixtures for selected cases
        if: env.CI_MODE == 'full' || env.CI_MODE == 'ui'
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import sys
          selected = Path('build/ui-test-arguments.txt').read_text().splitlines()
          if not selected or any(item.startswith('-only-testing:AnkiPadUITests/IncomingDocumentImportFlowTests/') for item in selected):
              subprocess.run([sys.executable, 'tests/received_import_fixtures.py', 'build/native/host/libankipad_bridge.dylib', 'ios/AnkiPadUITests/ReceivedFixtures'], check=True)
          PYTHON
      - name: Test backend language isolation and existing data preservation
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && (env.UI_SUITE == 'engine-languages' || env.UI_SUITE == 'languages'))
        run: python3 tests/backend_languages_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test browser route searches against the real collection
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && startsWith(env.UI_SUITE, 'incoming'))
        run: python3 tests/browser_link_search_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test collection editing, search and card actions
        if: env.CI_MODE == 'full'
        run: python3 tests/collection_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test bundled web interfaces
        if: env.CI_MODE == 'full'
        run: python3 tests/web_bridge_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test backups, collection restore, preferences and CSV import
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && env.UI_SUITE == 'backups')
        run: python3 tests/maintenance_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test reviewer typing, audio, custom scheduler and deck options
        if: env.CI_MODE == 'full'
        run: python3 tests/reviewer_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test note types, field migration, templates and preview
        if: env.CI_MODE == 'full'
        run: python3 tests/notetype_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test browser modes, columns and complete selection
        if: env.CI_MODE == 'full'
        run: python3 tests/browser_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test image occlusion creation, masks and editing
        if: env.CI_MODE == 'full'
        run: python3 tests/occlusion_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test filtered decks and custom study
        if: env.CI_MODE == 'full'
        run: python3 tests/custom_study_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test selected find-replace and package/text export
        if: env.CI_MODE == 'full'
        run: python3 tests/browser_edit_export_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test history calculation
        if: env.CI_MODE == 'full'
        run: python3 tests/eta_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test external link permission boundaries
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && env.UI_SUITE == 'card-links')
        run: |
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -swift-version 5 -parse-as-library ios/AnkiPad/CardExternalLaunchPolicy.swift tests/card_external_launch_smoke.swift -o build/card-external-launch-smoke
          build/card-external-launch-smoke
      - name: Test browser sound filename presentation
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && env.UI_SUITE == 'browser-appearance')
        run: |
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -swift-version 5 -parse-as-library ios/AnkiPad/BrowserMediaText.swift tests/browser_media_text_smoke.swift -o build/browser-media-text-smoke
          build/browser-media-text-smoke
      - name: Test theme resolution and card selectors
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && env.UI_SUITE == 'themes')
        run: |
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -swift-version 5 -parse-as-library ios/AnkiPad/StudyTheme.swift tests/study_theme_smoke.swift -o build/study-theme-smoke
          build/study-theme-smoke
      - name: Test review button timing boundaries
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && env.UI_SUITE == 'button-timing')
        run: |
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -swift-version 5 -parse-as-library ios/AnkiPad/ReviewButtonTiming.swift tests/review_button_timing_smoke.swift -o build/review-button-timing-smoke
          build/review-button-timing-smoke
      - name: Test backend template filter node compatibility
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && env.UI_SUITE == 'templates')
        run: |
          python3 tests/template_filter_nodes_smoke.py build/native/host/libankipad_bridge.dylib build/template-filter-nodes.json
          swiftc -target arm64-apple-macosx15.0 ios/AnkiPad/AppText.swift -swift-version 5 -parse-as-library ios/AnkiPad/TemplateNodeText.swift tests/template_node_smoke.swift -o build/template-node-smoke
          build/template-node-smoke build/template-filter-nodes.json
      - name: Test real conditional reminder due forecasts
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && (env.UI_SUITE == 'conditional-reminders' || env.UI_SUITE == 'conditional-only' || env.UI_SUITE == 'reminder-refresh' || env.UI_SUITE == 'incoming-final' || env.UI_SUITE == 'incoming-final-repair' || env.UI_SUITE == 'reminder-repair'))
        run: python3 tests/reminder_due_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test persisted current list selection
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && env.UI_SUITE == 'background-selection')
        run: python3 tests/current_deck_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test offline collection change detection
        if: env.CI_MODE == 'full' || env.CI_MODE == 'ui'
        run: python3 tests/local_sync_state_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test persisted deck disclosure and parent scheduling
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && env.UI_SUITE == 'collapse')
        run: python3 tests/deck_collapse_smoke.py build/native/host/libankipad_bridge.dylib
      - name: Test authenticated data and media sync
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && (env.UI_SUITE == 'network' || env.UI_SUITE == 'sync' || env.UI_SUITE == 'automatic' || env.UI_SUITE == 'repair' || env.UI_SUITE == 'engine-languages' || env.UI_SUITE == 'languages' || env.UI_SUITE == 'collapse' || env.UI_SUITE == 'regression-repair' || env.UI_SUITE == 'upload-only'))
        run: python3 tests/sync_smoke.py build/native/host/libankipad_bridge.dylib build/native/host/sync_test_server
      - name: Test interrupted download preservation and retry
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && (env.UI_SUITE == 'network' || env.UI_SUITE == 'sync' || env.UI_SUITE == 'automatic' || env.UI_SUITE == 'repair'))
        run: python3 tests/sync_interrupt_smoke.py build/native/host/libankipad_bridge.dylib build/native/host/sync_test_server
      - name: Test independent parallel sync fixtures
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && (env.UI_SUITE == 'automatic' || env.UI_SUITE == 'repair'))
        run: python3 tests/parallel_sync_fixtures_smoke.py build/native/host/libankipad_bridge.dylib build/native/host/sync_test_server build/fixture.apkg
      - name: Build iPad ARM64 engine
        if: (env.CI_MODE == 'full' || env.CI_MODE == 'ipa') && steps.native-device.outputs.cache-hit != 'true'
        run: bash scripts/build-native.sh device
      - name: Save completed native device outputs before app/UI checks
        uses: actions/cache/save@v4
        if: (env.CI_MODE == 'full' || env.CI_MODE == 'ipa') && steps.native-device.outputs.cache-hit != 'true'
        with:
          path: build/native/iphoneos
          key: ${{ steps.native-device.outputs.cache-primary-key }}
      - name: Build unsigned app
        if: env.CI_MODE == 'full' || env.CI_MODE == 'ipa'
        run: |
          cd ios
          xcodegen generate
          xcodebuild -project AnkiPad.xcodeproj -scheme AnkiPad -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ../build/xcode CODE_SIGNING_ALLOWED=NO ANKIPAD_SOURCE_COMMIT="$GITHUB_SHA" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
      - name: Package unsigned IPA for SideStore signing
        if: env.CI_MODE == 'full' || env.CI_MODE == 'ipa'
        run: |
          mkdir -p build/package/Payload
          cp -R build/xcode/Build/Products/Release-iphoneos/AnkiPad.app build/package/Payload/
          cp native/Cargo.lock build/Cargo.lock
          cd build/package
          zip -qr ../AnkiPad-unsigned.ipa Payload
          cd ..
          shasum -a 256 AnkiPad-unsigned.ipa > SHA256SUMS
      - name: Verify actual IPA architecture, provenance and absence of fixture decks
        if: env.CI_MODE == 'full' || env.CI_MODE == 'ipa'
        run: python3 scripts/verify-ipa.py build/AnkiPad-unsigned.ipa --source "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: env.CI_MODE == 'full' || env.CI_MODE == 'ipa'
        with:
          name: build-output
          path: |
            build/AnkiPad-unsigned.ipa
            build/SHA256SUMS
            build/Cargo.lock
          retention-days: 14
      - name: Build iPad simulator engine
        if: env.CI_MODE != 'ipa' && steps.native-simulator.outputs.cache-hit != 'true'
        run: bash scripts/build-native.sh simulator
      - name: Save completed native simulator outputs before app/UI checks
        uses: actions/cache/save@v4
        if: env.CI_MODE != 'ipa' && steps.native-simulator.outputs.cache-hit != 'true'
        with:
          path: build/native/iphonesimulator
          key: ${{ steps.native-simulator.outputs.cache-primary-key }}
      - name: Restore compiled SDK modules
        uses: actions/cache/restore@v4
        id: xcode-sdk-modules
        if: env.CI_MODE != 'ipa'
        with:
          path: build/simulator/SDKExplicitPrecompiledModules
          key: xcode-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-version.outputs.xcode }}
      - name: Restore Xcode simulator build intermediates
        uses: actions/cache/restore@v4
        id: xcode-simulator
        if: env.CI_MODE != 'ipa'
        with:
          path: |
            build/simulator/Build
            build/simulator/ModuleCache.noindex
            build/simulator/SDKStatCaches.noindex
            build/simulator/input-mtimes.json
          key: xcode-simulator-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-version.outputs.xcode }}-${{ steps.native-version.outputs.anki }}-${{ steps.native-version.outputs.simulator }}-adhoc-${{ github.sha }}
          restore-keys: xcode-simulator-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-version.outputs.xcode }}-${{ steps.native-version.outputs.anki }}-${{ steps.native-version.outputs.simulator }}-adhoc-
      - name: Compile app and test targets without executing tests
        id: compile-app
        if: env.CI_MODE == 'compile'
        run: |
          if [ -f build/fixture.apkg ]; then cp build/fixture.apkg ios/AnkiPad/Resources/fixture.apkg; fi
          cd ios
          xcodegen generate
          python3 ../scripts/xcode-input-mtimes.py restore --root .. --manifest ../build/simulator/input-mtimes.json
          python3 ../scripts/xcode-build-metrics.py ../build/simulator-build.json xcodebuild -project AnkiPad.xcodeproj -scheme AnkiPad -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -derivedDataPath ../build/simulator CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- ANKIPAD_SOURCE_COMMIT="$GITHUB_SHA" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" 'OTHER_SWIFT_FLAGS=$(inherited) -driver-show-incremental' -showBuildTimingSummary build-for-testing
          python3 ../scripts/verify-shared-products.py ../build/simulator/Build/Products/Debug-iphonesimulator/AnkiPad.app --source "$GITHUB_SHA"
      - name: Prepare isolated UI fixtures
        id: ui-prepare
        if: env.CI_MODE == 'full' || env.CI_MODE == 'ui'
        env:
          SIMULATOR_ID: ${{ steps.ui-simulator.outputs.simulator }}
        run: |
          if [ "$CI_MODE" = ui ] && [ "$UI_SUITE" != batch-check ] && [ "$UI_SUITE" != all ]; then
            python3 scripts/select-sync-fixtures.py build/ui-test-arguments.txt > build/ui-sync-ports.txt
            sync_ports=()
            while IFS= read -r sync_port; do
              if [ -n "$sync_port" ]; then sync_ports+=("$sync_port"); fi
            done < build/ui-sync-ports.txt
            if [ "${#sync_ports[@]}" -gt 0 ]; then
              for sync_port in "${sync_ports[@]}"; do
                SYNC_USER1='fixture@example.test:fixture-password' SYNC_USER2='empty@example.test:fixture-password' SYNC_HOST=127.0.0.1 SYNC_PORT="$sync_port" SYNC_BASE="$RUNNER_TEMP/ui-sync-server-$sync_port" build/native/host/sync_test_server > "build/ui-sync-server-$sync_port.log" 2>&1 &
                python3 tests/seed_ui_sync.py build/native/host/libankipad_bridge.dylib build/fixture.apkg "$sync_port"
                python3 tests/delayed_sync_proxy.py --port "$((sync_port + 2))" --upstream-port "$sync_port" > "build/delayed-sync-proxy-$sync_port.log" 2>&1 &
              done
            fi
            if rg -q '/ShareExtensionFlowTests/' build/ui-test-arguments.txt || [ "$CI_MODE" = full ] || [ "$UI_SUITE" = changed ] || [ "$UI_SUITE" = shared ] || [ "$UI_SUITE" = recovery-baseline ] || [ "$UI_SUITE" = incoming-milestone ] || [ "$UI_SUITE" = incoming-repair ] || [ "$UI_SUITE" = web-themes ] || [ "$UI_SUITE" = all ]; then
              python3 tests/shared_deck_fixture.py build/native/host/libankipad_bridge.dylib build/shared-fixture.apkg > build/shared-deck-server.log 2>&1 &
            fi
          fi
          cp build/fixture.apkg ios/AnkiPad/Resources/fixture.apkg
          if [ "$CI_MODE" = full ] || [ "$UI_SUITE" = images ] || [ "$UI_SUITE" = occlusion ] || [ "$UI_SUITE" = background ] || [ "$UI_SUITE" = background-ui ] || [ "$UI_SUITE" = background-selection ] || [ "$UI_SUITE" = theme-repair ] || [ "$UI_SUITE" = p1-next ] || [ "$UI_SUITE" = all ]; then
            python3 tests/make_occlusion_image.py build/occlusion-fixture.png
          fi
          cd ios
          xcodegen generate
          echo "simulator=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
      - name: Restore identical generated project and fixture timestamps
        if: env.CI_MODE == 'full' || env.CI_MODE == 'ui'
        run: python3 scripts/xcode-input-mtimes.py restore
      - name: Build signed simulator app and UI test targets
        id: ui-build
        if: env.CI_MODE == 'full' || env.CI_MODE == 'ui'
        env:
          SIMULATOR_ID: ${{ steps.ui-prepare.outputs.simulator }}
        run: |
          cd ios
          python3 ../scripts/xcode-build-metrics.py ../build/simulator-build.json xcodebuild -project AnkiPad.xcodeproj -scheme AnkiPad -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -derivedDataPath ../build/simulator CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- ANKIPAD_SOURCE_COMMIT="$GITHUB_SHA" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" 'OTHER_SWIFT_FLAGS=$(inherited) -driver-show-incremental' -showBuildTimingSummary build-for-testing
          python3 ../scripts/verify-shared-products.py ../build/simulator/Build/Products/Debug-iphonesimulator/AnkiPad.app --source "$GITHUB_SHA"
      - name: Save compiled SDK modules after successful build
        uses: actions/cache/save@v4
        if: (steps.compile-app.outcome == 'success' || steps.ui-build.outcome == 'success') && steps.xcode-sdk-modules.outputs.cache-hit != 'true'
        with:
          path: build/simulator/SDKExplicitPrecompiledModules
          key: ${{ steps.xcode-sdk-modules.outputs.cache-primary-key }}
      - name: Save input timestamps for completed simulator build
        if: steps.compile-app.outcome == 'success' || steps.ui-build.outcome == 'success'
        run: python3 scripts/xcode-input-mtimes.py save
      - name: Save completed Xcode build before UI execution
        uses: actions/cache/save@v4
        if: (steps.compile-app.outcome == 'success' || steps.ui-build.outcome == 'success') && steps.xcode-simulator.outputs.cache-hit != 'true'
        with:
          path: |
            build/simulator/Build
            build/simulator/ModuleCache.noindex
            build/simulator/SDKStatCaches.noindex
            build/simulator/input-mtimes.json
          key: ${{ steps.xcode-simulator.outputs.cache-primary-key }}
      - name: Plan serial UI batches
        id: ui-batch-plan
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && (env.UI_SUITE == 'batch-check' || env.UI_SUITE == 'all'))
        run: |
          proof_args=()
          if [ "$UI_SUITE" = batch-check ] && [ "$CI_MODE" != full ]; then proof_args+=(--proof); fi
          python3 scripts/plan-ui-batches.py "${proof_args[@]}" --output build/ui-batches.json >> "$GITHUB_OUTPUT"
      - name: Package compiled test products
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && (env.UI_SUITE == 'batch-check' || env.UI_SUITE == 'all'))
        run: python3 scripts/ui-products.py pack --source "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: env.CI_MODE == 'full' || (env.CI_MODE == 'ui' && (env.UI_SUITE == 'batch-check' || env.UI_SUITE == 'all'))
        with:
          name: compiled-checks
          path: |
            build/ui-products.tar.gz
            build/ui-products.json
          retention-days: 7
      - name: Execute selected UI cases without rebuilding
        if: env.CI_MODE == 'ui' && env.UI_SUITE != 'batch-check' && env.UI_SUITE != 'all'
        env:
          SIMULATOR_ID: ${{ steps.ui-prepare.outputs.simulator }}
        run: |
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          if [ -f build/occlusion-fixture.png ]; then xcrun simctl addmedia "$SIMULATOR_ID" build/occlusion-fixture.png; fi
          ui_workers=$(python3 scripts/select-ui-workers.py build/ui-test-arguments.txt)
          parallel_ui=NO
          if [ "$ui_workers" -gt 1 ]; then
            parallel_ui=YES
            xcrun simctl shutdown "$SIMULATOR_ID"
          fi
          xcrun simctl list devices booted -j > build/booted-before-tests.json
          cd ios
          ui_test_args=()
          while IFS= read -r selection; do
            if [ -n "$selection" ]; then ui_test_args+=("$selection"); fi
          done < ../build/ui-test-arguments.txt
          xcodebuild -project AnkiPad.xcodeproj -scheme AnkiPad -configuration Debug -sdk iphonesimulator "${ui_test_args[@]}" -parallel-testing-enabled "$parallel_ui" -parallel-testing-worker-count "$ui_workers" -maximum-concurrent-test-simulator-destinations 2 -destination "id=$SIMULATOR_ID" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -derivedDataPath ../build/simulator -resultBundlePath ../build/UITests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- ANKIPAD_SOURCE_COMMIT="$GITHUB_SHA" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" test-without-building
      - name: Export structured UI failures and timing
        if: always() && env.CI_MODE == 'ui' && env.UI_SUITE != 'batch-check' && env.UI_SUITE != 'all'
        run: |
          if [ -d build/UITests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/UITests.xcresult > build/test-summary.json
            xcrun xcresulttool get test-results tests --path build/UITests.xcresult > build/test-tree.json
            python3 scripts/summarize-ui-results.py build/test-summary.json
          fi
          xcrun simctl list devices booted -j > build/booted-after-tests.json
      - name: Export simulator screenshots
        if: always() && env.CI_MODE == 'ui' && env.UI_SUITE != 'batch-check' && env.UI_SUITE != 'all'
        run: |
          if [ -f build/UITests.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always() && env.CI_MODE == 'ui' && env.UI_SUITE != 'batch-check' && env.UI_SUITE != 'all'
        with:
          name: test-results
          path: |
            build/UITests.xcresult
            build/screenshots
            build/shared-deck-server.log
            build/ui-sync-server.log
            build/ui-sync-server-*.log
            build/delayed-sync-proxy.log
            build/delayed-sync-proxy-*.log
            build/simulator-boot.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && env.CI_MODE == 'ui' && env.UI_SUITE != 'batch-check' && env.UI_SUITE != 'all'
        with:
          name: screenshots
          path: build/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && env.CI_MODE == 'ui' && env.UI_SUITE != 'batch-check' && env.UI_SUITE != 'all'
        with:
          name: ui-diagnostics
          path: |
            build/test-summary.json
            build/test-tree.json
            build/UITests.xcresult/database.sqlite3
            build/booted-before-tests.json
            build/booted-after-tests.json
            build/screenshots/manifest.json
            build/screenshots/*.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove owned test simulator
        if: always() && env.CI_MODE == 'ui' && env.UI_SUITE != 'all' && env.UI_SUITE != 'batch-check'
        run: python3 scripts/ci-simulator.py delete
      - uses: actions/upload-artifact@v4
        if: always() && env.CI_MODE != 'ipa'
        with:
          name: compile-metrics
          path: |
            build/simulator-build.json
            build/simulator-build.log
          if-no-files-found: ignore
          retention-days: 14

  ui-batch:
    name: Check batch ${{ matrix.batch }}
    needs: build
    if: inputs.mode == 'full' || (inputs.mode == 'ui' && (inputs.ui_suite == 'batch-check' || inputs.ui_suite == 'all'))
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: ${{ fromJSON(needs.build.outputs.batches) }}
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: compiled-checks
          path: build
      - name: Verify and unpack compiled products
        run: python3 scripts/ui-products.py unpack --source "$GITHUB_SHA"
      - name: Prepare fresh isolated test services
        run: bash scripts/prepare-batch-services.sh
      - name: Start fresh iPad simulator
        id: simulator
        run: |
          simulator_id=$(python3 scripts/ci-simulator.py create)
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl addmedia "$simulator_id" build/occlusion-fixture.png
      - name: Execute assigned cases without compiling
        env:
          BATCH_INDEX: ${{ matrix.batch }}
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: python3 scripts/run-ui-batch.py "$BATCH_INDEX" "$SIMULATOR_ID"
      - name: Export batch attachments
        if: always()
        run: |
          if [ -f build/UITests.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-diagnostics-${{ matrix.batch }}
          path: |
            build/test-summary.json
            build/test-tree.json
            build/screenshots/manifest.json
            build/screenshots/*.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.batch }}
          path: |
            build/UITests.xcresult
            build/screenshots
            build/ui-sync-server-*.log
            build/delayed-sync-proxy-*.log
            build/shared-deck-server.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove owned test simulator
        if: always()
        run: python3 scripts/ci-simulator.py delete
